[project]
name = "vision-station"
version = "0.1.0"
description = "Vision Station: a configurable vision system for fixed industrial stations (jobs, tools, PASS/FAIL/ERROR)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "babel>=2.18.0",
    "fastapi>=0.143.0",
    "numpy",
    "onnxruntime>=1.31.0",
    "opencv-python-headless",
    "pydantic>=2.12",  # Field(exclude_if=) keeps `affects_result: true` out of saved jobs
    "pyyaml",
    "uvicorn[standard]>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
vision-station = "vision_station.runtime:main"

[project.optional-dependencies]
# C920 controls (TD-04); Windows only
uvc = ["duvc-ctl; sys_platform == 'win32'"]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "httpx>=0.28.1",
    "onnx>=1.23.2",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_station"]

[tool.pytest.ini_options]
testpaths = ["tests"]
