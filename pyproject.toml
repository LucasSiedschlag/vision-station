[project]
name = "vision-station"
version = "0.1.0"
description = "Vision Station: a configurable vision system for fixed industrial stations (jobs, tools, PASS/FAIL/ERROR)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "numpy",
    "opencv-python-headless",
    "pydantic>=2",
    "pyyaml",
    "uvicorn[standard]>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[project.optional-dependencies]
# C920 controls (TD-04); Windows only
uvc = ["duvc-ctl; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_station"]

[tool.pytest.ini_options]
testpaths = ["tests"]
