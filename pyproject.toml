[project]
name = "vision-station"
version = "0.1.0"
description = "Packaging vision system: checks that each box leaves the station closed and taped."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
# C920 controls (TD-04); Windows only
uvc = ["duvc-ctl; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_station"]

[tool.pytest.ini_options]
testpaths = ["tests"]
