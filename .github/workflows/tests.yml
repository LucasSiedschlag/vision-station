name: tests

on: [push, pull_request]

jobs:
  pytest:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: The generated API types match the API
        run: |
          npm run gen:api
          git diff --exit-code -- src/api
      - run: npm run build
      - run: npm run size
      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the simulated station
        run: npm run e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
      - name: The API serves the built interface
        run: uv run pytest tests/test_api.py -q
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

  package:
    # the installed program and its installer, built and started on Windows (TD-15)
    needs: [pytest, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the program and the installer
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - name: The program starts and serves the API and the interface
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'vs-data'
          New-Item -ItemType Directory -Force "$data\system" | Out-Null
          "camera: {driver: file, connection: {path: '$($env:RUNNER_TEMP -replace '\\','/')/frames', loop: true, fps: 5}}" | Set-Content "$data\system\system.yaml"
          $p = Start-Process dist\vision-station\vision-station.exe -ArgumentList '--data', $data -PassThru -RedirectStandardError "$env:RUNNER_TEMP\vs.err" -RedirectStandardOutput "$env:RUNNER_TEMP\vs.out"
          $ok = $false
          foreach ($i in 1..60) {
            try { $state = Invoke-RestMethod http://127.0.0.1:8765/api/state; $ok = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if ($ok) { $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:RUNNER_TEMP\vs.err" -Tail 30
          if (-not $ok) { throw 'the program did not answer' }
          Write-Host "state: $($state.state) - $($state.message)"
          if ($page.Content -notmatch 'id="root"') { throw 'the interface is not served' }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/VisionStation-*-setup.exe
            THIRD_PARTY_LICENSES.md
